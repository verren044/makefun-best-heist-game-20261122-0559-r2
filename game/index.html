<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Gilded Vault — a one-room heist</title>
<style>
  html, body { margin: 0; padding: 0; background: #0b0b12; height: 100%; }
  body { display: flex; align-items: center; justify-content: center; font-family: Georgia, 'Times New Roman', serif; }
  #wrap { position: relative; width: 960px; max-width: 100vw; }
  canvas { display: block; width: 100%; height: auto; background: #17131f; box-shadow: 0 0 60px #000; }
  #hint { color: #8f86a8; text-align: center; font-size: 13px; margin-top: 10px; font-family: Verdana, sans-serif; }
</style>
</head>
<body>
<div id="wrap">
  <canvas id="game" width="960" height="600"></canvas>
  <div id="hint">WASD / arrows to move &middot; Shift to sneak &middot; E or Space to grab the Star &middot; click to walk there &middot; M to mute &middot; R to restart</div>
</div>
<script type="module" src="./src/main.js"></script>
</body>
</html>
